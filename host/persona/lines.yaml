# 宣布句：每家学院 3 个变体（共 12 句），全部预录，绝不在运行时合成。
# draft：文案待 C 定稿；host 用 TTS 念桥接句，预录音频是可选项（PRERECORD_REQUIRED=1 才强制）
lines:
  courage:
    - 赤翎！你这种人，墙在前面也当门用。
    - 赤翎。别回头，你要去的地方还没修好路。
    - 赤翎——先撞了再说，剩下的路上想。
  ambition:
    - 玄渊。你想要的东西不小，那就去拿。
    - 玄渊！眼睛别只盯着别人的位置。
    - 玄渊——想要就得拿，别只是看着。
  wisdom:
    - 星枢。你脑子转得比嘴快，去那儿慢慢想。
    - 星枢。想明白再动手，你不缺那几分钟。
    - 星枢——想清楚再动，你一向如此。
  loyalty:
    - 穗垣。你护着的人不少，继续护着。
    - 穗垣！别忘了也给自己留一个位置。
    - 穗垣——护住身边的人，也护住自己。
