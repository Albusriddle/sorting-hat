# 宣布句：每家学院 3 个变体（共 12 句），全部预录，绝不在运行时合成。
# PLACEHOLDER：文案待 C 定稿；定稿后同步重录 host/assets/preroll/{house}-{1..3}.opus
lines:
  courage:
    - 【占位】赤翎！你这种人，墙在前面也当门用。
    - 【占位】赤翎。别回头，你要去的地方还没修好路。
    - 【占位】赤翎——先撞了再说，剩下的路上想。
  ambition:
    - 【占位】玄渊。你想要的东西不小，那就去拿。
    - 【占位】玄渊！眼睛别只盯着别人的位置。
    - 【占位】玄渊——想要就得拿，别只是看着。
  wisdom:
    - 【占位】星枢。你脑子转得比嘴快，去那儿慢慢想。
    - 【占位】星枢。想明白再动手，你不缺那几分钟。
    - 【占位】星枢——想清楚再动，你一向如此。
  loyalty:
    - 【占位】穗垣。你护着的人不少，继续护着。
    - 【占位】穗垣！别忘了也给自己留一个位置。
    - 【占位】穗垣——护住身边的人，也护住自己。
